[tools]
node = "24"

[tasks.install]
description = "Install the pinned dependencies"
run = "npm ci"

[tasks.typecheck]
description = "Type-check the TypeScript; never emits"
run = "npm run typecheck"

[tasks.lint]
description = "Reject regular expressions that match HTML or CSS (Biome with the rule in lint/)"
run = "npm run lint"

[tasks.test]
description = "Unit suite"
run = "npm test"

[tasks.build]
description = "Validate the registry and variants and write dist/ (BASE_PATH defaults to the GitHub Pages path)"
run = 'BASE_PATH="${BASE_PATH:-/personal-website/}" npm run build'

[tasks.serve]
description = "Serve dist/ under BASE_PATH"
depends = ["build"]
run = 'BASE_PATH="${BASE_PATH:-/personal-website/}" npm run serve'

[tasks.e2e]
description = "Browser suite (Playwright)"
run = "npm run test:e2e"

[tasks.check]
description = "Everything to run before claiming a change works"
depends = ["typecheck", "lint", "test", "build"]

[tasks.ci]
description = "The GitHub workflow's steps, in its order: install, typecheck, lint, unit suite, browser suite, build"
run = [
  { task = "install" },
  { task = "typecheck" },
  { task = "lint" },
  { task = "test" },
  { task = "e2e" },
  { task = "build" },
]
