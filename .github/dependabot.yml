version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release must be a week old before it is proposed: compromised releases are usually found and
    # pulled within days, and minor and patch updates are merged and deployed without a person.
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Matches the Node major in mise.toml and CI; bump together with them.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
