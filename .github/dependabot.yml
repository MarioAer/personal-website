version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Matches the Node major in mise.toml and CI; bump together with them.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
